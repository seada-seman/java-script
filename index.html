<!doctype html>
<html>
  <head>
    <title>My first website</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="heroSection">
      <header class="headerBox">
        <div>
          <img src="./Logo.png" alt="Logo" width="154px" />
        </div>
        <div class="linkBox">
          <a class="link" href="#">Home</a>
          <a class="link" href="#">Service</a>
          <a class="link" href="#">Feature</a>
          <a class="link" href="#">Product</a>
          <a class="link" href="#">Testimonial</a>
          <a class="link" href="#">FAQ</a>
        </div>
        <div class="buttonBox">
          <a class="textButton" href="#">Login</a>
          <a class="button" href="#">Sign up</a>
        </div>
      </header>
      <div class="heroBox">
        <div>
          <h1 class="heroText">
            Lessons and insights<br />
            <span class="heroSubText">from 8 years</span>
          </h1>
          <p style="color: #717171">
            Where to grow your business as a photographer: site or social media?
          </p>
          <a class="button" style="margin-top: 15px;" href="#">Register</a>
        </div>
        <div>
          <img class="heroImage"  src="./Illustration.png" alt="Hero image" />
        </div>
      </div>
    </div>
  </body>
</html>
